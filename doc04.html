<!DOCTYPE html>
<html>
    <head>
        <meta charset ="UTF-8">
        <style>
            ol li {list-style-type: upper-alpha;}
            li {list-style-type: square;}
        </style>
    </head>
    <body>
        <p>순서가 없는 목록</p> 
        <ul>
            <li>첫번째</li>
            <li>두번째</li>
            <li>세번째</li>
        </ul>
        <p>순서가 있는 목록</p>
        <ol>
            <li>첫번째</li>
            <li>두번째</li>
            <li>세번째</li>
        </ol>
    </body>
</html>
